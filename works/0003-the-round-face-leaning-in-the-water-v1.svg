<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05061a"/>
      <stop offset="0.6" stop-color="#121a42"/>
      <stop offset="1" stop-color="#26356b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a63"/>
      <stop offset="1" stop-color="#0b1c30"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f6f1dc"/>
      <stop offset="1" stop-color="#cfc8ac"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="wob" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.012 0.06" numOctaves="2" seed="4" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
    <clipPath id="pondclip"><rect x="0" y="330" width="800" height="270"/></clipPath>
  </defs>

  <!-- sky -->
  <rect width="800" height="340" fill="url(#sky)"/>

  <!-- rows of sparkles, counted slow; they run past the edges -->
  <g stroke-linecap="round" fill="none" stroke="#fff6d8">
    <line x1="-12" y1="22" x2="812" y2="22" stroke-width="2" stroke-dasharray="0 31" opacity="0.35">
      <animate attributeName="opacity" values="0.2;0.45;0.2" dur="7s" repeatCount="indefinite"/></line>
    <line x1="-2" y1="52" x2="812" y2="52" stroke-width="3" stroke-dasharray="0 27" opacity="0.5">
      <animate attributeName="opacity" values="0.35;0.65;0.35" dur="6s" repeatCount="indefinite"/></line>
    <line x1="-20" y1="86" x2="812" y2="86" stroke-width="3" stroke-dasharray="0 29" opacity="0.65">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="8s" repeatCount="indefinite"/></line>
    <line x1="-9" y1="122" x2="812" y2="122" stroke-width="4" stroke-dasharray="0 26" opacity="0.7">
      <animate attributeName="opacity" values="0.55;0.85;0.55" dur="5s" repeatCount="indefinite"/></line>
    <line x1="-17" y1="160" x2="812" y2="160" stroke-width="3" stroke-dasharray="0 33" opacity="0.6">
      <animate attributeName="opacity" values="0.45;0.75;0.45" dur="9s" repeatCount="indefinite"/></line>
    <line x1="-5" y1="198" x2="812" y2="198" stroke-width="4" stroke-dasharray="0 28" opacity="0.7">
      <animate attributeName="opacity" values="0.55;0.85;0.55" dur="6.5s" repeatCount="indefinite"/></line>
    <line x1="-14" y1="238" x2="812" y2="238" stroke-width="3" stroke-dasharray="0 30" opacity="0.6"/>
    <line x1="-1" y1="278" x2="812" y2="278" stroke-width="4" stroke-dasharray="0 25" opacity="0.7">
      <animate attributeName="opacity" values="0.5;0.85;0.5" dur="7.5s" repeatCount="indefinite"/></line>
    <line x1="-10" y1="314" x2="812" y2="314" stroke-width="3" stroke-dasharray="0 32" opacity="0.5"/>
  </g>

  <!-- a crowd of sparkles, close together -->
  <g fill="#fff6d8" opacity="0.85">
    <circle cx="420" cy="70" r="2.2"/><circle cx="430" cy="78" r="1.8"/><circle cx="414" cy="82" r="1.6"/>
    <circle cx="438" cy="64" r="1.5"/><circle cx="426" cy="92" r="2"/><circle cx="446" cy="86" r="1.6"/>
    <circle cx="408" cy="64" r="1.4"/><circle cx="452" cy="72" r="1.8"/><circle cx="436" cy="100" r="1.4"/>
    <circle cx="418" cy="100" r="1.5"/><circle cx="458" cy="96" r="1.3"/><circle cx="402" cy="90" r="1.5"/>
  </g>

  <!-- the gold star, and the blue one close beside it on purpose -->
  <circle cx="170" cy="104" r="46" fill="url(#glow)"/>
  <path d="M170 80 L175 99 L194 104 L175 109 L170 128 L165 109 L146 104 L165 99 Z" fill="#ffd44a">
    <animate attributeName="opacity" values="1;0.75;1" dur="4s" repeatCount="indefinite"/></path>
  <path d="M208 118 L210.5 126 L218.5 128.5 L210.5 131 L208 139 L205.5 131 L197.5 128.5 L205.5 126 Z" fill="#8fc4ff"/>

  <!-- a gold one beside the far ones too -->
  <path d="M740 40 L742 47 L749 49 L742 51 L740 58 L738 51 L731 49 L738 47 Z" fill="#ffd44a"/>
  <path d="M762 52 L763.3 56 L767.3 57.3 L763.3 58.6 L762 62.6 L760.7 58.6 L756.7 57.3 L760.7 56 Z" fill="#8fc4ff"/>

  <!-- the dark, a little past the last sparkle -->
  <rect width="800" height="14" fill="#02030c" opacity="0.7"/>

  <!-- the Moon -->
  <circle cx="600" cy="175" r="95" fill="url(#glow)"/>
  <circle cx="600" cy="175" r="58" fill="url(#moon)"/>
  <g fill="#b9b192" opacity="0.8">
    <circle cx="582" cy="156" r="11"/><circle cx="620" cy="190" r="14"/>
    <circle cx="598" cy="203" r="7"/><circle cx="626" cy="153" r="6"/>
    <circle cx="571" cy="186" r="5"/><circle cx="608" cy="172" r="4"/>
  </g>
  <g fill="none" stroke="#fffbea" stroke-width="1.2" opacity="0.7">
    <circle cx="582" cy="156" r="11"/><circle cx="620" cy="190" r="14"/>
    <circle cx="598" cy="203" r="7"/><circle cx="626" cy="153" r="6"/>
  </g>
  <!-- beads of sun light along the rough edge, different each time -->
  <g fill="#fffdf0">
    <circle cx="552" cy="196" r="3.4"/><circle cx="556" cy="208" r="2"/>
    <circle cx="563" cy="221" r="3"/><circle cx="574" cy="229" r="1.8"/>
    <circle cx="588" cy="235" r="2.8"/><circle cx="603" cy="233" r="1.6"/>
    <circle cx="617" cy="230" r="3.2"/><circle cx="631" cy="223" r="2"/>
    <circle cx="641" cy="214" r="1.5"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="3.5s" repeatCount="indefinite"/>
  </g>

  <!-- far bank -->
  <path d="M0 336 Q120 322 230 334 T470 332 T800 330 L800 345 L0 345 Z" fill="#0a1226"/>

  <!-- pond -->
  <rect x="0" y="334" width="800" height="266" fill="url(#water)"/>

  <g clip-path="url(#pondclip)">
    <!-- sky reflected, wobbly -->
    <g filter="url(#wob)" opacity="0.5">
      <circle cx="600" cy="500" r="40" fill="#e9e3c4"/>
      <circle cx="170" cy="470" r="6" fill="#ffd44a"/>
      <circle cx="196" cy="480" r="3" fill="#8fc4ff"/>
      <g stroke-linecap="round" stroke="#fff6d8" fill="none">
        <line x1="0" y1="380" x2="800" y2="380" stroke-width="3" stroke-dasharray="0 34"/>
        <line x1="0" y1="415" x2="800" y2="415" stroke-width="3" stroke-dasharray="0 28"/>
      </g>
    </g>

    <!-- ripples -->
    <g fill="none" stroke="#bfe0ff" stroke-width="2">
      <ellipse cx="380" cy="470" rx="130" ry="44" opacity="0.5">
        <animate attributeName="rx" values="120;260" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="40;86" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="4s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="380" cy="470" rx="130" ry="44" opacity="0.5">
        <animate attributeName="rx" values="120;260" dur="4s" begin="-2s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="40;86" dur="4s" begin="-2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="4s" begin="-2s" repeatCount="indefinite"/></ellipse>
    </g>

    <!-- the round face leaning in the water -->
    <g transform="translate(380 462) rotate(-12) scale(1 0.92)" filter="url(#wob)" opacity="0.92">
      <circle cx="-68" cy="-66" r="30" fill="#0d0d14"/>
      <circle cx="68" cy="-66" r="30" fill="#0d0d14"/>
      <ellipse cx="0" cy="0" rx="98" ry="86" fill="#f2f4f2"/>
      <ellipse cx="-38" cy="-6" rx="22" ry="30" transform="rotate(25 -38 -6)" fill="#0d0d14"/>
      <ellipse cx="38" cy="-6" rx="22" ry="30" transform="rotate(-25 38 -6)" fill="#0d0d14"/>
      <circle cx="-36" cy="-8" r="6" fill="#fff"/>
      <circle cx="36" cy="-8" r="6" fill="#fff"/>
      <circle cx="-35" cy="-8" r="2.6" fill="#0d0d14"/>
      <circle cx="37" cy="-8" r="2.6" fill="#0d0d14"/>
      <ellipse cx="0" cy="22" rx="12" ry="8" fill="#0d0d14"/>
      <path d="M0 30 Q-2 44 -14 44 M0 30 Q2 44 14 44" fill="none" stroke="#0d0d14" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- splash drops, small and falling down -->
    <g fill="#d6ecff" opacity="0.9">
      <path d="M498 430 q-5 9 0 12 q5 -3 0 -12 Z">
        <animateTransform attributeName="transform" type="translate" values="0 -14;6 10" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/></path>
      <path d="M520 448 q-4 7 0 10 q4 -3 0 -10 Z">
        <animateTransform attributeName="transform" type="translate" values="0 -10;8 12" dur="2.2s" begin="-0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="-0.8s" repeatCount="indefinite"/></path>
      <path d="M262 420 q-4 7 0 10 q4 -3 0 -10 Z">
        <animateTransform attributeName="transform" type="translate" values="0 -10;-8 12" dur="2.2s" begin="-1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="-1.4s" repeatCount="indefinite"/></path>
      <circle cx="540" cy="470" r="3"/>
      <circle cx="244" cy="446" r="2.5"/>
    </g>

    <!-- a feather floating -->
    <g transform="translate(655 540) rotate(-18)">
      <path d="M-60 0 Q-10 -26 60 -4 Q10 20 -60 0 Z" fill="#f4efe2"/>
      <path d="M-62 1 L58 -4" stroke="#b9ae93" stroke-width="2" fill="none"/>
      <g stroke="#cfc6ad" stroke-width="1">
        <line x1="-30" y1="-1" x2="-22" y2="-14"/><line x1="-10" y1="-2" x2="0" y2="-17"/>
        <line x1="10" y1="-3" x2="22" y2="-14"/><line x1="-30" y1="0" x2="-22" y2="10"/>
        <line x1="-8" y1="-1" x2="2" y2="11"/><line x1="14" y1="-3" x2="26" y2="6"/>
      </g>
      <ellipse cx="0" cy="8" rx="76" ry="7" fill="none" stroke="#bfe0ff" stroke-width="1.5" opacity="0.4"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 3;0 0" dur="5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- near bank with sniffing stones -->
  <path d="M0 600 L0 548 Q60 530 120 548 Q150 556 180 570 L230 600 Z" fill="#0a1226"/>
  <ellipse cx="60" cy="560" rx="38" ry="22" fill="#6c7280"/>
  <ellipse cx="52" cy="552" rx="18" ry="8" fill="#8b92a0"/>
  <ellipse cx="128" cy="574" rx="24" ry="14" fill="#575d6b"/>
  <ellipse cx="124" cy="568" rx="10" ry="4" fill="#767d8c"/>
  <ellipse cx="30" cy="586" rx="20" ry="11" fill="#7a808e"/>
  <circle cx="75" cy="556" r="1.6" fill="#4a505c"/><circle cx="46" cy="566" r="1.3" fill="#4a505c"/>
  <circle cx="134" cy="576" r="1.2" fill="#3d4350"/>
</svg>